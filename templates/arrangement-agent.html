<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <link rel="stylesheet" href="../workspace.css">
<link rel="stylesheet" href="../vendor/katex/katex.min.css">
  <link rel="stylesheet" href="../opensim-note/style.css">
  <link rel="stylesheet" href="../code-styles.css">
  <script defer src="../highlight-json.js"></script>
<script defer src="../navigation.js"></script></head>
<body>
  <a class="skip-link" href="#content">跳至正文</a>
  <header class="reader-mast"><a class="brand" href="../index.html" aria-label="FitGen 首页"><span class="brand-symbol" aria-hidden="true"><i></i><i></i><i></i><i></i></span>FitGen</a><a class="return-link" href="../index.html#module-2" data-return aria-label="返回模块 2 · 团操编排 Agent">返回模块 2</a><button type="button" class="reader-menu" aria-expanded="false" aria-controls="reader-index" hidden>目录</button></header>

    <div class="sidebar-label">本文目录</div>
    <nav aria-label="本文目录">{{nav}}</nav>
  </aside>
  <main>
    <article class="page" id="content">
      <h1>{{title}}</h1>
      <div class="title-rule"></div>
      <div class="prose">{{body}}</div>
    </article>
  </main>
  <script src="../vendor/katex/katex.min.js"></script>
  <script src="../vendor/katex/contrib/auto-render.min.js"></script>
  <script>
    renderMathInElement(document.querySelector('.prose'), {
      delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}],
      throwOnError: false
    });
  </script>

</html>
